<div class="container main-container">
  <h1>Login</h1>
  <hr>

  <form novalidate (ngSubmit)="login()" [formGroup]="form">
    <h4>Entre na sua conta</h4>
    <hr>

    @if (errors.length > 0) {
      <div class="alert alert-danger">
        <h5 id="msgRetorno">Opa! Alguma coisa não deu certo:</h5>
        <ul class="mb-0">
          @for (error of errors; track $index) {
            <li>{{ error }}</li>
          }
        </ul>
      </div>
    }

    <div class="mb-4">
      <label class="form-label fw-semibold" for="email">E-mail</label>
        <input
          class="form-control"
          id="email"
          type="email"
          placeholder="E-mail (requerido)"
          formControlName="email"
          [ngClass]="{ 'is-invalid': displayMessage['email'] }"
        />

        @if (displayMessage['email']) {
          <div class="text-danger small">
            {{ displayMessage['email'] }}
          </div>
        }
    </div>


    <div class="mb-3">
      <label class="form-label fw-semibold" for="password">Senha</label>
        <input
          class="form-control"
          id="password"
          type="password"
          placeholder="Senha (requerido)"
          formControlName="password"
          [ngClass]="{ 'is-invalid': displayMessage['password'] }"
        />

        @if (displayMessage['password']) {
          <span class="text-danger small">
            {{ displayMessage['password'] }}
          </span>
        }
    </div>


    <div class="d-flex gap-2 mt-4">
      <button
        class="btn btn-success"
        id="login"
        type="submit"
        [disabled] ="!form.valid">
        Login
      </button>
    </div>

  </form>
</div>
